<form [formGroup]="form" (ngSubmit)="onSubmit()">
    
    <!-- Prima riga: Nome e Categoria -->
    <div class="row">
      <div class="col-md-6 form-field">
        <label for="nome" class="form-label p-0 m-0">Nome <span class="text-danger">*</span></label>
        <input
          type="text"
          id="nome"
          class="form-control"
          formControlName="nome"
          [class.is-invalid]="submitted && form.controls['nome'].invalid"
          placeholder="Inserisci il nome del pacchetto">
        <div class="invalid-feedback" *ngIf="submitted && form.controls['nome'].invalid">
          Il nome è obbligatorio (min 3, max 99 caratteri).
        </div>
      </div>

      <div class="col-md-6 form-field">
        <label for="categoria" class="form-label p-0 m-0">Categoria <span class="text-danger">*</span></label>
        <select
          id="categoria"
          class="form-select"
          formControlName="categoria"
          [class.is-invalid]="submitted && form.controls['categoria'].invalid">
          <option value="">Seleziona categoria</option>
          <option *ngFor="let categoria of categorieOpzioni" [value]="categoria.value">
            {{ categoria.label }}
          </option>
        </select>
        <div class="invalid-feedback" *ngIf="submitted && form.controls['categoria'].invalid">
          Seleziona una categoria.
        </div>
      </div>
    </div>

    <!-- Seconda riga: Descrizione -->
    <div class="row mt-3">
      <div class="col-12 form-field">
        <label for="descrizione" class="form-label p-0 m-0">Descrizione</label>
        <textarea
          id="descrizione"
          class="form-control"
          formControlName="descrizione"
          rows="3"
          [class.is-invalid]="submitted && form.controls['descrizione'].invalid"
          placeholder="Inserisci una descrizione del pacchetto..."></textarea>
        <div class="invalid-feedback" *ngIf="submitted && form.controls['descrizione'].invalid">
          Massimo 500 caratteri.
        </div>
      </div>
    </div>

    <!-- Terza riga: Livello e Durata -->
    <div class="row mt-3">
      <div class="col-md-6 form-field">
        <label for="livello" class="form-label p-0 m-0">Livello <span class="text-danger">*</span></label>
        <select
          id="livello"
          class="form-select"
          formControlName="livello"
          [class.is-invalid]="submitted && form.controls['livello'].invalid">
          <option value="">Seleziona livello</option>
          <option *ngFor="let livello of livelliOpzioni" [value]="livello.value">
            {{ livello.label }}
          </option>
        </select>
        <div class="invalid-feedback" *ngIf="submitted && form.controls['livello'].invalid">
          Seleziona un livello.
        </div>
      </div>

      <div class="col-md-6 form-field">
        <label for="durataMinuti" class="form-label p-0 m-0">Durata (minuti) <span class="text-danger">*</span></label>
        <input
          type="number"
          id="durataMinuti"
          class="form-control"
          formControlName="durataMinuti"
          [class.is-invalid]="submitted && form.controls['durataMinuti'].invalid"
          placeholder="Es: 60">
        <div class="invalid-feedback" *ngIf="submitted && form.controls['durataMinuti'].invalid">
          La durata è obbligatoria (min 15, max 180 minuti).
        </div>
      </div>
    </div>

    <!-- Quarta riga: Max Partecipanti e Prezzo -->
    <div class="row mt-3">
      <div class="col-md-6 form-field">
        <label for="maxPartecipanti" class="form-label p-0 m-0">Max Partecipanti <span class="text-danger">*</span></label>
        <input
          type="number"
          id="maxPartecipanti"
          class="form-control"
          formControlName="maxPartecipanti"
          [class.is-invalid]="submitted && form.controls['maxPartecipanti'].invalid"
          placeholder="Es: 10">
        <div class="invalid-feedback" *ngIf="submitted && form.controls['maxPartecipanti'].invalid">
          Il numero massimo di partecipanti è obbligatorio (min 1, max 50).
        </div>
      </div>

      <div class="col-md-6 form-field">
        <label for="prezzo" class="form-label p-0 m-0">Prezzo (€) <span class="text-danger">*</span></label>
        <input
          type="number"
          step="0.01"
          id="prezzo"
          class="form-control"
          formControlName="prezzo"
          [class.is-invalid]="submitted && form.controls['prezzo'].invalid"
          placeholder="Es: 25.00">
        <div class="invalid-feedback" *ngIf="submitted && form.controls['prezzo'].invalid">
          Il prezzo è obbligatorio (min 0).
        </div>
      </div>
    </div>

    <!-- Quinta riga: Checkbox Attivo -->
    <div class="row mt-3">
      <div class="col-md-6 form-field">
        <div class="form-check mt-4">
          <input
            type="checkbox"
            id="attivo"
            class="form-check-input"
            formControlName="attivo">
          <label for="attivo" class="form-check-label">
            Pacchetto attivo
          </label>
        </div>
      </div>
    </div>

  </form>
