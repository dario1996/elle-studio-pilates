<div class="password-reset-form">
  <!-- Alert di successo -->
  <div *ngIf="showSuccess" class="alert alert-success mb-3">
    <i class="fas fa-check-circle me-2"></i>
    <strong>Email inviata!</strong> Controlla la tua casella di posta.
  </div>

  <!-- Alert di errore -->
  <div *ngIf="showError" class="alert alert-danger mb-3">
    <i class="fas fa-exclamation-circle me-2"></i>
    {{ errorMessage }}
  </div>

  <!-- Form -->
  <form #resetForm="ngForm" *ngIf="!showSuccess">
    <p class="text-muted mb-4">
      <i class="fas fa-info-circle me-2"></i>
      Inserisci l'email associata al tuo account. Riceverai un link per reimpostare la password.
    </p>
    
    <div class="mb-3">
      <label for="resetEmail" class="form-label">Email</label>
      <div class="input-group">
        <span class="input-group-text">
          <i class="fas fa-envelope"></i>
        </span>
        <input 
          type="email" 
          id="resetEmail"
          name="email"
          class="form-control" 
          [(ngModel)]="email"
          required
          email
          placeholder="tuaemail@esempio.com"
          [disabled]="isLoading"
          [class.is-invalid]="resetForm.submitted && resetForm.controls['email'].invalid"
        />
      </div>
      <div class="invalid-feedback d-block" *ngIf="resetForm.submitted && resetForm.controls['email'].invalid">
        Inserisci un'email valida
      </div>
    </div>
  </form>
</div>
