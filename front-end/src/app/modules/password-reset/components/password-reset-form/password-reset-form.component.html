<div class="password-reset-form">
  <!-- Alert di successo -->
  <div *ngIf="showSuccess" class="alert alert-success mb-3">
    <i class="fas fa-check-circle me-2"></i>
    <strong>Password aggiornata!</strong> Ora puoi effettuare il login con la nuova password.
  </div>

  <!-- Alert di errore -->
  <div *ngIf="showError" class="alert alert-danger mb-3">
    <i class="fas fa-exclamation-circle me-2"></i>
    {{ errorMessage }}
  </div>

  <!-- Form -->
  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" *ngIf="!showSuccess" autocomplete="on">
    
    <!-- Campo username nascosto per il password manager -->
    <input 
      type="text" 
      name="username"
      [value]="username"
      autocomplete="username"
      style="display: none;"
      readonly>
    
    <!-- Nuova password -->
    <div class="form-group mb-3">
      <label for="newPassword" class="form-label">Nuova Password *</label>
      <input 
        type="password" 
        id="newPassword" 
        name="new-password"
        formControlName="newPassword"
        class="form-control"
        [class.is-invalid]="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched"
        placeholder="Inserisci la nuova password"
        autocomplete="new-password"
        [disabled]="isLoading">
      
      <!-- Requisiti password -->
      <div class="password-requirements mt-2">
        <p class="requirements-title mb-1"><small>La password deve contenere:</small></p>
        <ul class="list-unstyled mb-0">
          <li *ngFor="let requirement of getPasswordRequirements()" 
              class="requirement-item"
              [class.requirement-valid]="requirement.valid"
              [class.requirement-invalid]="!requirement.valid">
            <i class="fas fa-sm" [ngClass]="requirement.valid ? 'fa-check-circle' : 'fa-times-circle'"></i>
            <small>{{ requirement.text }}</small>
          </li>
        </ul>
      </div>
    </div>

    <!-- Conferma password -->
    <div class="form-group mb-3">
      <label for="confirmPassword" class="form-label">Conferma Nuova Password *</label>
      <input 
        type="password" 
        id="confirmPassword" 
        name="confirm-password"
        formControlName="confirmPassword"
        class="form-control"
        [class.is-invalid]="(passwordForm.get('confirmPassword')?.invalid || hasPasswordMismatch()) && passwordForm.get('confirmPassword')?.touched"
        placeholder="Conferma la nuova password"
        autocomplete="new-password"
        [disabled]="isLoading">
      <div class="invalid-feedback d-block" *ngIf="passwordForm.get('confirmPassword')?.hasError('required') && passwordForm.get('confirmPassword')?.touched">
        La conferma password è obbligatoria
      </div>
      <div class="invalid-feedback d-block" *ngIf="hasPasswordMismatch()">
        Le password non coincidono
      </div>
    </div>

  </form>
</div>
